{% extends 'base.html' %}

{% block title %}비밀번호 변경 | ThRead{% endblock title %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <h1 class="mb-4">비밀번호 변경</h1>
      <form action="{% url 'accounts:change_password' %}" method="POST">
        {% csrf_token %}
        {% include '_form_fields.html' %}
        <button type="submit" class="btn btn-primary">제출</button>
        <a href="{% url 'accounts:update' %}" class="btn btn-outline-secondary">취소</a>
      </form>
    </div>
  </div>
{% endblock content %}
