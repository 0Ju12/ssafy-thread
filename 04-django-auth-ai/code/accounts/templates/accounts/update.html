{% extends 'base.html' %}

{% block title %}회원정보 수정 | ThRead{% endblock title %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <h1 class="mb-4">회원정보 수정</h1>
      <form action="{% url 'accounts:update' %}" method="POST">
        {% csrf_token %}
        {% include '_form_fields.html' %}
        {# F411 : 회원정보 수정 페이지에서 비밀번호 변경 페이지로 이동하는 링크 #}
        <p><a href="{% url 'accounts:change_password' %}">비밀번호 변경</a></p>
        <button type="submit" class="btn btn-primary">저장</button>
        <a href="{% url 'accounts:profile' user.username %}" class="btn btn-outline-secondary">취소</a>
      </form>
    </div>
  </div>
{% endblock content %}
