{% extends 'base.html' %}

{% block title %}도서 등록 | ThRead{% endblock title %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <h1 class="mb-4">도서 등록 페이지</h1>
      <form action="{% url 'books:create' %}" method="POST" id="book-form">
        {% csrf_token %}
        {% include '_form_fields.html' %}
        <p class="form-text">※ 등록하면 AI 가 저자 정보를 찾아 정리합니다. 몇 초에서 수십 초가 걸릴 수 있습니다.</p>
        <button type="submit" class="btn btn-primary" id="submit-btn">제출</button>
        <a href="{% url 'books:index' %}" class="btn btn-outline-secondary">취소</a>
      </form>
    </div>
  </div>

  <script>
    // AI 응답을 기다리는 동안 버튼을 잠가 중복 제출을 막음
    document.getElementById('book-form').addEventListener('submit', () => {
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = '등록 중... (작가 정보 생성 중)';
    });
  </script>
{% endblock content %}
