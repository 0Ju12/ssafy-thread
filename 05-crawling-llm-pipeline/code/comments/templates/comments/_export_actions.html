<section class="panel enhance-actions" aria-label="결과 다운로드 및 이력 비교">
  <div>
    <h2 class="section-title">분석 데이터 활용</h2>
    <p class="muted">원본·정제·증강 기록을 파일로 저장하거나 같은 종목의 이전 분석과 비교합니다.</p>
  </div>
  <div class="enhance-controls">
    <label for="download-stage">다운로드 단계</label>
    <select id="download-stage" class="enhance-select" aria-label="다운로드할 데이터 단계">
      <option value="all">전체 단계</option><option value="original">원본</option>
      <option value="removed">부적절 제거</option><option value="clean">전처리</option>
      <option value="augmented">증강</option>
    </select>
    <a class="btn btn-quiet enhance-link" id="export-csv" data-base="{% url 'comments:export' result.pk 'csv' %}" href="{% url 'comments:export' result.pk 'csv' %}?stage=all">CSV 다운로드</a>
    <a class="btn btn-quiet enhance-link" id="export-json" data-base="{% url 'comments:export' result.pk 'json' %}" href="{% url 'comments:export' result.pk 'json' %}?stage=all">JSON 다운로드</a>
    <a class="btn enhance-link" href="{% url 'comments:compare_history' result.pk %}">이전 분석 비교{% if related_results %} ({{ related_results|length }}){% endif %}</a>
  </div>
</section>
<script>
(function () {
  const select = document.getElementById('download-stage');
  if (!select) return;
  select.addEventListener('change', function () {
    ['export-csv','export-json'].forEach(function (id) {
      const link = document.getElementById(id);
      if (link) link.href = link.dataset.base + '?stage=' + encodeURIComponent(select.value);
    });
  });
})();
</script>
